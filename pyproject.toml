[project]
name = "recursive-lean-prover-flow"
version = "0.1.2"
description = "Recursive Lean Prover for hmz: recursively plan, prove, compare, review and catalogue Lean theorems."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/humanfia/recursive-lean-prover-flow"
Issues = "https://github.com/humanfia/recursive-lean-prover-flow/issues"

[dependency-groups]
dev = [
    "hmz @ git+https://github.com/humanfia/humanize@claude/env-at-run",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.16.5",
]

[tool.uv]
# The flow is a directory hmz imports, not a package anybody installs.
package = false

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 88

[tool.ruff.format]
# A skill is prose an agent reads, code blocks and all, and is written as it is meant to read.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # The formatter owns line length; prose it cannot split is left as written.
    "E501",
    # Flow state is read as the flow API documents it, which is not as a dict.
    "SIM401",
]

[tool.ruff.lint.per-file-ignores]
# A test loads the flow, which puts its directory on `sys.path`, before importing from it.
"tests/**" = ["E402"]
